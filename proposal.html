<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>제안서 요청 | Trickguys</title>
  <link href="css/style.css" rel="stylesheet" />
</head>
<body class="animsition" style="background:#1b1b1b; color:#fff;">

  <div style="max-width:560px; margin:80px auto; padding:0 18px;">
    <h1 style="font-size:28px; margin:0 0 10px;">제안서 요청</h1>
    <p style="opacity:.8; line-height:1.6; margin:0 0 22px;">
      학교 관계자 확인을 위해 이메일을 입력하시면 제안서를 자동 발송해드립니다.
    </p>

  <form action="https://script.google.com/macros/s/AKfycbzpdvkfZDLL2JHQHFq-XaQzuymtva8nNTrK0yuoYU2bdZ8Gxh4kqD2ny17qKPbzOD8l7g/exec"
      method="GET"
      target="proposal_iframe"
      onsubmit="return onProposalSubmit(this);">

  <input name="school" type="text" placeholder="학교명(선택)">
  <input name="name" type="text" placeholder="담당자 성함(선택)">
  <input name="email" type="email" placeholder="이메일(필수)" required>

  <button type="submit" class="btn-primary" id="proposalBtn">📄 제안서 받기</button>
  <div id="proposalMsg" style="display:none; margin-top:12px; font-weight:700;"></div>
</form>

<!-- 완전 숨김 iframe (새탭 안 뜸) -->
<iframe name="proposal_iframe" title="proposal" style="display:none;"></iframe>

<script>
  function onProposalSubmit(form) {
    const btn = document.getElementById("proposalBtn");
    const msg = document.getElementById("proposalMsg");

    btn.disabled = true;
    btn.textContent = "전송 중...";
    btn.style.opacity = "0.65";
    btn.style.cursor = "not-allowed";

    msg.style.display = "block";
    msg.textContent = "요청을 접수했어요. 잠시 후 이메일을 확인해주세요.";

    setTimeout(() => {
      // ✅ 완료 상태로 전환
      btn.disabled = false;
      btn.textContent = "✅ 요청완료! 홈페이지로 이동";
      btn.style.opacity = "1";
      btn.style.cursor = "pointer";

      // ✅ 핵심: submit 버튼 → 일반 버튼으로 변경 (재전송 방지)
      btn.type = "button";

      // ✅ form submit 완전히 차단 (인라인 onsubmit 포함)
      form.removeAttribute("onsubmit");
      form.addEventListener("submit", (e) => e.preventDefault());

      // ✅ 클릭 시 홈으로 이동
      btn.onclick = () => {
        window.location.href = "https://trickguys.co.kr";
      };
    }, 2000);

    return true; // 최초 1회 전송은 유지
  }
</script>
<script>
  const params = new URLSearchParams(window.location.search);
  const sent = params.get("sent");

  if (sent === "1") {
    document.body.innerHTML = `
      <div style="max-width:560px; margin:100px auto; padding:0 18px; text-align:center;">
        <h2 style="margin-bottom:16px;">✅ 요청이 완료되었습니다</h2>
        <p style="opacity:.8; line-height:1.6;">
          입력하신 이메일로 제안서를 발송했습니다.<br>
          스팸함/프로모션함도 확인해주세요.
        </p>

        <a href="https://trickguys.co.kr"
           style="
             display:inline-block;
             margin-top:28px;
             padding:14px 22px;
             background:#ff3b7a;
             color:#fff;
             border-radius:14px;
             font-weight:700;
             text-decoration:none;
           ">
           홈페이지로 돌아가기
        </a>
      </div>
    `;
  }
</script>
</body>
</html>
